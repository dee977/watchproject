<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#070708" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9E7D3B" />
    </linearGradient>
    <linearGradient id="dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="800" fill="url(#bg)" />
  
  <!-- Outer Case -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.85" />
  <circle cx="400" cy="400" r="260" fill="url(#dial)" stroke="#2a2b30" stroke-width="2" />
  <circle cx="400" cy="400" r="250" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,8" />
  
  <!-- Hour Markers -->
  <g stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="400" y1="170" x2="400" y2="195" />
    <line x1="400" y1="605" x2="400" y2="630" />
    <line x1="170" y1="400" x2="195" y2="400" />
    <line x1="605" y1="400" x2="630" y2="400" />
    <line x1="237" y1="237" x2="255" y2="255" stroke-width="2" />
    <line x1="563" y1="237" x2="545" y2="255" stroke-width="2" />
    <line x1="237" y1="563" x2="255" y2="545" stroke-width="2" />
    <line x1="563" y1="563" x2="545" y2="545" stroke-width="2" />
  </g>
  
  <!-- Subdials -->
  <circle cx="400" cy="490" r="45" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5" />
  <circle cx="330" cy="380" r="45" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5" />
  <circle cx="470" cy="380" r="45" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5" />
  
  <!-- Brand Text -->
  <text x="400" y="300" font-family="Georgia, serif" font-size="20" fill="url(#gold)" text-anchor="middle" letter-spacing="6" font-weight="bold">AURELIA</text>
  <text x="400" y="320" font-family="sans-serif" font-size="9" fill="#999" text-anchor="middle" letter-spacing="3">GENÈVE</text>
  
  <!-- Watch Hands -->
  <line x1="400" y1="400" x2="340" y2="290" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" />
  <line x1="400" y1="400" x2="490" y2="340" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="400" y1="430" x2="400" y2="230" stroke="#DFBA73" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  <circle cx="400" cy="400" r="9" fill="#C5A059" />
  <circle cx="400" cy="400" r="4" fill="#070708" />
  
  <!-- Status Text -->
  <text x="400" y="690" font-family="sans-serif" font-size="12" fill="#71717A" text-anchor="middle" letter-spacing="2">SWISS HOROLOGY</text>
</svg>
